name: Python Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsna-knee-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Compile Python and syntax-check release helper
        run: |
          python -m compileall -q src scripts
          bash -n scripts/prepare_public_release.sh tests

      - name: Smoke-test command-line entry points
        run: |
          python -m scripts.train --help
          python -m scripts.evaluate --help
          python -m scripts.predict --help
          python -m scripts.submit --help
          python -m scripts.download_dataset --help

      - name: Run unit tests
        run: python -m pytest -q
